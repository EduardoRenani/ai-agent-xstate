name: Release

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write  # required for npm provenance attestation

jobs:
    publish:
        name: publish @eduardorenani/atlasjs to npm
        runs-on: ubuntu-latest
        environment: npm-publish
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"
                  cache: npm

            - name: Verify tag matches package version
              working-directory: packages/atlas
              run: |
                  tag="${{ github.event.release.tag_name }}"
                  version_from_tag="${tag#v}"
                  pkg_version=$(node -p "require('./package.json').version")
                  if [ "$version_from_tag" != "$pkg_version" ]; then
                      echo "::error::Tag '$tag' (=> $version_from_tag) does not match package.json version '$pkg_version'"
                      exit 1
                  fi
                  echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
              id: version

            - name: Install
              run: npm ci

            - name: Test (build @eduardorenani/atlasjs + all workspaces)
              run: npm test

            - name: Derive dist-tag
              id: tag
              run: |
                  v="${{ steps.version.outputs.version }}"
                  case "$v" in
                      *-alpha*) echo "tag=alpha" >> "$GITHUB_OUTPUT" ;;
                      *-beta*)  echo "tag=beta"  >> "$GITHUB_OUTPUT" ;;
                      *-rc*)    echo "tag=rc"    >> "$GITHUB_OUTPUT" ;;
                      0.*)      echo "tag=alpha" >> "$GITHUB_OUTPUT" ;;
                      *)        echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
                  esac

            - name: Publish to npm
              working-directory: packages/atlas
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish --provenance --access public --tag "${{ steps.tag.outputs.tag }}"
